syntax = "proto3";

// 公共定义：错误码、消息类型、信封
// 其他 .proto 通过 import "common.proto" 引用
package NetMsg;

// 错误码（0 = 成功，非 0 = 失败）
// 约定：所有 Resp 消息的 error_code 固定放在 field 1，业务字段从 field 2 往后排，
//       这样新增字段直接往下追加，无需改动已有字段号
enum ErrorCode {
  ERROR_NONE = 0;              // 成功
  ERROR_INTERNAL = 1000;       // 服务器内部错误（含响应非 proto 等异常情况）
  ERROR_USER_EXISTS = 1001;    // 用户名已存在
  ERROR_WRONG_CREDENTIALS = 1002;  // 用户名或密码错误
  ERROR_UNAUTHORIZED = 1003;   // 未授权（未带 token 或 token 无效）
  ERROR_PLAYER_NOT_FOUND = 1004;   // 玩家不存在
  ERROR_PROFILE_NOT_FOUND = 1005;  // 养成数据不存在
}

// 全局消息类型（UDP 信封 msg_type 用）
// 编号全局唯一，由编译器保证不重复；新增消息在此追加枚举值即可
enum MsgType {
  MSG_NONE = 0;                    // 占位
  MSG_PLAYER_INPUT = 1;            // 玩家操作（客户端->服务器）
  MSG_FRAME_DATA = 2;              // 帧数据（服务器->客户端）
  MSG_MAIL_PUSH = 3;               // 邮件推送
  MSG_ACTIVITY_REWARD_PUSH = 4;    // 活动结算推送
  MSG_UDP_LOGIN_REQ = 5;           // UDP 连接认证请求（客户端->GameServer，带 JWT token）
  MSG_UDP_LOGIN_ACK = 6;           // UDP 连接认证回复（GameServer->客户端）
}

// 消息信封：所有 UDP 消息统一包在这一层，首字段标识消息类型，payload 承载具体消息
message NetMsgEnvelope {
  MsgType msg_type = 1;   // 消息类型（见 MsgType 枚举）
  bytes payload = 2;      // 具体消息的 proto 序列化字节
}
