syntax = "proto3";

// 养成数据相关：获取/保存玩家养成数据（HTTP）
package NetMsg;

import "net_common.proto";

// 获取养成数据请求 / 响应
message GetDataReq {
  int32 player_id = 1;
}
message GetDataResp {
  ErrorCode error_code = 1;   // ERROR_NONE = 成功
  int32 gold = 2;
  int32 stage_progress = 3;
  string tower_levels = 4;   // JSON: {"tower_1": 3}
}

// 保存养成数据请求 / 响应
message SaveDataReq {
  int32 gold = 1;
  int32 stage_progress = 2;
  string tower_levels = 3;
}
message SaveDataResp {
  ErrorCode error_code = 1;   // ERROR_NONE = 成功
}
